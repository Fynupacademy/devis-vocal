<html lang="fr">
<head>

<style>
  :root{
    --paper:#F5F2ED; --ink:#2A2823; --line:#D8D2C4;
    --accent:#B5651D; --accent-soft:#EFE1D2; --mono:'SF Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);}
  .wrap{max-width:460px;margin:0 auto;padding:24px 16px 80px;}
  h1{font-size:22px;margin:0 0 4px;font-weight:700;}
  .sub{color:#6B6558;font-size:13px;margin-bottom:24px;}

  /* Login */
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-card{width:100%;max-width:360px;padding:32px 24px;background:white;border:1px solid var(--line);border-radius:6px;}
  .login-card h1{text-align:center;margin-bottom:4px;}
  .login-card .sub{text-align:center;}
  .lfg{margin-bottom:14px;}
  .lfg label{display:block;font-size:13px;margin-bottom:5px;color:#4A453C;}
  .lfg input{width:100%;padding:11px 12px;border:1.5px solid var(--ink);border-radius:4px;font-size:16px;font-family:inherit;}
  .pwd-wrap{position:relative;display:flex;align-items:center;}
  .pwd-wrap input{flex:1;padding-right:64px;}
  .pwd-toggle{position:absolute;right:10px;background:none;border:none;color:#9B9B9B;font-size:12px;font-weight:600;cursor:pointer;}
  .btn-primary{width:100%;padding:13px;border:none;border-radius:4px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;}
  .btn-primary:disabled{background:#B8B2A2;}
  .login-toggle{text-align:center;font-size:13px;margin-top:16px;color:#6B6558;}
  .login-toggle a{color:var(--accent);cursor:pointer;text-decoration:underline;}
  .login-forgot{text-align:right;font-size:12px;margin:-8px 0 14px;}
  .login-forgot a{color:var(--accent);cursor:pointer;text-decoration:underline;}
  .auth-error{color:#A33B2F;font-size:13px;margin-top:10px;min-height:16px;}

  /* App shell */
  #appScreen{display:none;}
  .topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px;}
  .topbar button{background:none;border:none;font-size:13px;color:#6B6558;text-decoration:underline;cursor:pointer;}
  .tabs{display:flex;gap:6px;margin-bottom:20px;}
  .tab{flex:1;padding:10px;text-align:center;border:1.5px solid var(--ink);border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;background:white;}
  .tab.active{background:var(--ink);color:var(--paper);}
  .panel{display:none;}
  .panel.active{display:block;}

  /* Tarifs */
  .tarif-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .tarif-row input{padding:9px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px;font-family:inherit;}
  .tarif-row input.type{flex:1.2;}
  .tarif-row input.prix{flex:1;}
  .tarif-row button{border:none;background:none;color:#A33B2F;font-size:18px;cursor:pointer;padding:0 6px;}
  .btn-secondary{width:100%;padding:10px;border:1.5px dashed var(--ink);border-radius:4px;background:none;font-size:13px;cursor:pointer;margin-top:6px;}

  /* Devis form */
  textarea{width:100%;min-height:90px;border:1.5px solid var(--ink);border-radius:4px;padding:13px;font-size:16px;font-family:inherit;resize:vertical;}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .mic-hint{font-size:12px;color:#8A8474;margin:6px 0 14px;line-height:1.5;}
  input.client-nom{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:4px;font-size:15px;font-family:inherit;margin-bottom:12px;}

  .result{background:white;border:1px solid var(--line);border-radius:4px;margin-top:20px;overflow:hidden;display:none;}
  .result.visible{display:block;}
  .result-head{background:var(--accent-soft);padding:11px 15px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);}
  .result-body{padding:15px;}
  .result-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #EEEAE0;}
  .result-row span:last-child{font-family:var(--mono);}
  .result-total{display:flex;justify-content:space-between;padding-top:11px;margin-top:8px;border-top:2px solid var(--ink);font-size:16px;font-weight:700;}
  .result-total span:last-child{font-family:var(--mono);}
  .save-btn{width:100%;padding:12px;border:none;border-radius:4px;background:var(--accent);color:white;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px;}

  /* Historique */
  .devis-card{background:white;border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px;}
  .devis-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px;}
  .devis-meta{font-size:12px;color:#8A8474;margin-bottom:6px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.envoye{background:#EFE1D2;color:#8A5A22;}
  .badge.relance{background:#FBE9E7;color:#A33B2F;}
  .badge.accepte{background:#E1EFE3;color:#2E6B3E;}
  .badge.refuse{background:#EAEAEA;color:#6B6558;}
  select.statut-select{margin-top:8px;padding:7px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-family:inherit;}

  .empty{text-align:center;color:#8A8474;font-size:13px;padding:30px 0;}
  .error{background:#FBE9E7;border:1px solid #D98276;color:#8A3B2F;border-radius:4px;padding:11px 13px;font-size:13px;margin-top:14px;display:none;}
  .error.visible{display:block;}
  .status{text-align:center;font-size:13px;color:var(--accent);min-height:18px;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <h1 id="authTitle">Devis Vocal</h1>
    <p class="sub" id="authSub">Connectez-vous à votre compte</p>

    <div class="lfg"><label>Email</label><input type="email" id="authEmail" autocomplete="email"></div>
    <div class="lfg">
      <label>Mot de passe</label>
      <div class="pwd-wrap">
        <input type="password" id="authPassword" placeholder="" autocomplete="current-password">
        <button type="button" class="pwd-toggle" id="pwdToggleBtn" onclick="togglePwdVisibility()">Afficher</button>
      </div>
    </div>
    <div class="login-forgot" id="forgotLink"><a onclick="showForgotPassword()">Mot de passe oublié ?</a></div>

    <button class="btn-primary" id="authBtn" onclick="doAuth()">Se connecter</button>
    <div class="auth-error" id="authError"></div>

    <div class="login-toggle" id="authToggle">
      Pas encore de compte ? <a onclick="toggleSignup()">Créer un compte</a>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appScreen">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 style="font-size:18px;margin:0;">Devis Vocal</h1>
      </div>
      <button onclick="doLogout()">Déconnexion</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="devis" onclick="showTab('devis')">Nouveau devis</div>
      <div class="tab" data-tab="tarifs" onclick="showTab('tarifs')">Tarifs</div>
      <div class="tab" data-tab="historique" onclick="showTab('historique')">Historique</div>
    </div>

    <!-- Panel: Tarifs -->
    <div class="panel" id="panel-tarifs">
      <p class="sub">Vos types de prestation et prix au m² (ou à l'unité).</p>
      <div id="tarifsListe"></div>
      <button class="btn-secondary" onclick="ajouterLigneTarif()">+ Ajouter un tarif</button>
      <button class="save-btn" onclick="sauverTarifs()">Enregistrer les tarifs</button>
      <div class="status" id="tarifsStatus"></div>
    </div>

    <!-- Panel: Nouveau devis -->
    <div class="panel active" id="panel-devis">
      <input type="text" class="client-nom" id="clientNom" placeholder="Nom du client (optionnel)">
      <div class="mic-hint">Touchez le champ, puis utilisez le <strong>micro du clavier</strong> pour dicter.</div>
      <textarea id="devisTexte" placeholder="Ex. : quarante mètres carrés de mur, deux couches"></textarea>
      <button class="btn-primary" id="analyserBtn" onclick="analyserDevis()">Analyser et calculer</button>
      <div class="status" id="devisStatus"></div>

      <div class="result" id="devisResult">
        <div class="result-head">Devis généré</div>
        <div class="result-body" id="devisResultBody"></div>
      </div>
      <button class="save-btn" id="enregistrerDevisBtn" style="display:none;" onclick="enregistrerDevis()">Enregistrer ce devis</button>

      <div class="error" id="devisError"></div>
    </div>

    <!-- Panel: Historique -->
    <div class="panel" id="panel-historique">
      <div id="historiqueListe"><div class="empty">Chargement...</div></div>
    </div>

  </div>
</div>

<script>
// ============================================================
// Configuration Supabase (standard FynUp)
// ============================================================
const SUPABASE_URL = "https://mgpsmasigxholxxuqenh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ncHNtYXNpZ3hob2x4eHVxZW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzOTk1ODUsImV4cCI6MjA5NTk3NTU4NX0.lK0as0we_DmVq8wGjaA13YBj-B7NLdbdiFmXn3w17Vs";
const EDGE_FUNCTION_URL = SUPABASE_URL + "/functions/v1/extraire-devis";

let session = null;
let isSignup = false;
let dernierResultat = null; // items + total en attente d'enregistrement

// ---------- Auth ----------
function togglePwdVisibility(){
  const inp = document.getElementById("authPassword");
  const btn = document.getElementById("pwdToggleBtn");
  if (inp.type === "password") { inp.type = "text"; btn.textContent = "Masquer"; }
  else { inp.type = "password"; btn.textContent = "Afficher"; }
}

function toggleSignup(){
  isSignup = !isSignup;
  document.getElementById("authTitle").textContent = isSignup ? "Créer un compte" : "Devis Vocal";
  document.getElementById("authSub").textContent = isSignup ? "Créez votre accès" : "Connectez-vous à votre compte";
  document.getElementById("authBtn").textContent = isSignup ? "Créer le compte" : "Se connecter";
  document.getElementById("authToggle").innerHTML = isSignup
    ? 'Déjà un compte ? <a onclick="toggleSignup()">Se connecter</a>'
    : 'Pas encore de compte ? <a onclick="toggleSignup()">Créer un compte</a>';
  document.getElementById("authError").textContent = "";
}

function showForgotPassword(){
  document.getElementById("authTitle").textContent = "Mot de passe oublié";
  document.getElementById("authSub").textContent = "Recevez un lien de réinitialisation par email";
  document.getElementById("authPassword").closest(".lfg").style.display = "none";
  document.getElementById("forgotLink").style.display = "none";
  document.getElementById("authBtn").textContent = "Envoyer le lien";
  document.getElementById("authBtn").setAttribute("onclick", "doForgotPassword()");
  document.getElementById("authToggle").innerHTML = '<a onclick="backToLogin()">Retour à la connexion</a>';
  document.getElementById("authError").textContent = "";
}
function backToLogin(){
  document.getElementById("authPassword").closest(".lfg").style.display = "";
  document.getElementById("forgotLink").style.display = "";
  document.getElementById("authBtn").textContent = "Se connecter";
  document.getElementById("authBtn").setAttribute("onclick", "doAuth()");
  document.getElementById("authTitle").textContent = "Devis Vocal";
  document.getElementById("authSub").textContent = "Connectez-vous à votre compte";
  document.getElementById("authToggle").innerHTML = 'Pas encore de compte ? <a onclick="toggleSignup()">Créer un compte</a>';
}

async function doForgotPassword(){
  const email = document.getElementById("authEmail").value.trim();
  const errEl = document.getElementById("authError");
  if (!email) { errEl.textContent = "Entrez votre email d'abord."; return; }
  try {
    await fetch(SUPABASE_URL + "/auth/v1/recover", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    errEl.style.color = "#2E6B3E";
    errEl.textContent = "Si ce compte existe, un email a été envoyé.";
  } catch (e) {
    errEl.textContent = "Erreur : " + e.message;
  }
}

async function doAuth(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const errEl = document.getElementById("authError");
  const btn = document.getElementById("authBtn");
  errEl.style.color = "#A33B2F";
  errEl.textContent = "";

  if (!email || !password) { errEl.textContent = "Email et mot de passe requis."; return; }

  btn.disabled = true;
  const endpoint = isSignup ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";

  try {
    const res = await fetch(SUPABASE_URL + endpoint, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.error_description || data.msg || data.error || "Erreur de connexion.";
      btn.disabled = false;
      return;
    }

    if (isSignup && !data.access_token) {
      errEl.style.color = "#2E6B3E";
      errEl.textContent = "Compte créé. Vérifiez votre email pour confirmer, puis connectez-vous.";
      btn.disabled = false;
      return;
    }

    session = data;
    localStorage.setItem("devisvocal_session", JSON.stringify(data));
    entrerDansApp();
  } catch (e) {
    errEl.textContent = "Erreur réseau : " + e.message;
    btn.disabled = false;
  }
}

function doLogout(){
  session = null;
  localStorage.removeItem("devisvocal_session");
  document.getElementById("appScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
}

function entrerDansApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appScreen").style.display = "block";
  chargerTarifs();
  chargerHistorique();
}

// Restaurer session existante
(function initSession(){
  const saved = localStorage.getItem("devisvocal_session");
  if (saved) {
    try { session = JSON.parse(saved); entrerDansApp(); } catch(e) {}
  }
})();

// Wrapper pour appels authentifiés à l'API Supabase (avec gestion JWT expiré)
async function apiFetch(path, options = {}){
  const headers = Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + (session ? session.access_token : ""),
    "Content-Type": "application/json"
  }, options.headers || {});
  const res = await fetch(SUPABASE_URL + path, Object.assign({}, options, { headers }));
  if (res.status === 401) {
    const txt = await res.text();
    if (txt.includes("JWT expired") || txt.includes("PGRST303")) {
      doLogout();
      throw new Error("Session expirée, reconnectez-vous.");
    }
  }
  return res;
}

// ---------- Onglets ----------
function showTab(name){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  if (name === "historique") chargerHistorique();
}

// ---------- Tarifs ----------
function ligneTarifHTML(type = "", prix = ""){
  const div = document.createElement("div");
  div.className = "tarif-row";
  div.innerHTML = `
    <input class="type" placeholder="Type (ex: mur)" value="${type}">
    <input class="prix" type="number" step="0.05" placeholder="Prix CHF/m²" value="${prix}">
    <button onclick="this.parentElement.remove()">✕</button>`;
  return div;
}

function ajouterLigneTarif(type, prix){
  document.getElementById("tarifsListe").appendChild(ligneTarifHTML(type || "", prix || ""));
}

async function chargerTarifs(){
  const res = await apiFetch("/rest/v1/devis_tarifs?select=type,prix_unitaire");
  const data = await res.json();
  const liste = document.getElementById("tarifsListe");
  liste.innerHTML = "";
  if (Array.isArray(data) && data.length > 0) {
    data.forEach(t => ajouterLigneTarif(t.type, t.prix_unitaire));
  } else {
    ajouterLigneTarif("mur", 12);
    ajouterLigneTarif("plafond", 15);
    ajouterLigneTarif("facade", 22);
  }
}

async function sauverTarifs(){
  const statusEl = document.getElementById("tarifsStatus");
  statusEl.textContent = "Enregistrement...";
  const lignes = Array.from(document.querySelectorAll("#tarifsListe .tarif-row"));
  const tarifs = lignes.map(l => ({
    type: l.querySelector(".type").value.trim().toLowerCase(),
    prix_unitaire: parseFloat(l.querySelector(".prix").value)
  })).filter(t => t.type && !isNaN(t.prix_unitaire));

  // Supprime les anciens puis réinsère (simple, suffisant pour ce volume de données)
  await apiFetch("/rest/v1/devis_tarifs?user_id=eq." + session.user.id, { method: "DELETE" });

  if (tarifs.length > 0) {
    const payload = tarifs.map(t => Object.assign({ user_id: session.user.id }, t));
    await apiFetch("/rest/v1/devis_tarifs", {
      method: "POST",
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify(payload)
    });
  }
  statusEl.textContent = "Tarifs enregistrés.";
  setTimeout(() => statusEl.textContent = "", 2000);
}

// ---------- Devis : dictée + analyse ----------
async function analyserDevis(){
  const texte = document.getElementById("devisTexte").value.trim();
  const statusEl = document.getElementById("devisStatus");
  const errEl = document.getElementById("devisError");
  const btn = document.getElementById("analyserBtn");
  const resultEl = document.getElementById("devisResult");

  errEl.classList.remove("visible");
  resultEl.classList.remove("visible");
  document.getElementById("enregistrerDevisBtn").style.display = "none";

  if (!texte) { errEl.textContent = "Dictez ou écrivez d'abord une phrase."; errEl.classList.add("visible"); return; }

  const lignes = Array.from(document.querySelectorAll("#tarifsListe .tarif-row"));
  const tarifs = {};
  lignes.forEach(l => {
    const t = l.querySelector(".type").value.trim().toLowerCase();
    const p = parseFloat(l.querySelector(".prix").value);
    if (t && !isNaN(p)) tarifs[t] = p;
  });

  if (Object.keys(tarifs).length === 0) {
    errEl.textContent = "Configurez d'abord vos tarifs dans l'onglet Tarifs.";
    errEl.classList.add("visible");
    return;
  }

  btn.disabled = true;
  statusEl.textContent = "Analyse en cours...";

  try {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + session.access_token, "Content-Type": "application/json" },
      body: JSON.stringify({ texte, types_possibles: Object.keys(tarifs) })
    });
    const data = await res.json();

    if (data.error) { throw new Error(data.error); }
    const items = data.items || [];

    if (items.length === 0) {
      errEl.textContent = "Aucune donnée exploitable trouvée dans la phrase.";
      errEl.classList.add("visible");
      statusEl.textContent = "";
      btn.disabled = false;
      return;
    }

    let total = 0;
    const bodyEl = document.getElementById("devisResultBody");
    bodyEl.innerHTML = "";
    const itemsAvecMontant = [];

    items.forEach(item => {
      const prixUnitaire = tarifs[item.type];
      if (!prixUnitaire) return;
      const couches = item.couches && item.couches > 1 ? item.couches : 1;
      const multiplicateur = 1 + (couches - 1) * 0.4;
      const montant = item.surface_m2 * prixUnitaire * multiplicateur;
      total += montant;
      itemsAvecMontant.push(Object.assign({}, item, { montant: Math.round(montant * 100) / 100 }));

      const row = document.createElement("div");
      row.className = "result-row";
      const label = `${item.type} — ${item.surface_m2} m²${couches > 1 ? ` (${couches} couches)` : ""}`;
      row.innerHTML = `<span>${label}</span><span>${montant.toFixed(2)} CHF</span>`;
      bodyEl.appendChild(row);
    });

    const totalRow = document.createElement("div");
    totalRow.className = "result-total";
    totalRow.innerHTML = `<span>Total</span><span>${total.toFixed(2)} CHF</span>`;
    bodyEl.appendChild(totalRow);

    resultEl.classList.add("visible");
    document.getElementById("enregistrerDevisBtn").style.display = "block";
    dernierResultat = { items: itemsAvecMontant, total: Math.round(total * 100) / 100 };
    statusEl.textContent = "";
  } catch (e) {
    errEl.textContent = "Erreur : " + e.message;
    errEl.classList.add("visible");
    statusEl.textContent = "";
  }
  btn.disabled = false;
}

async function enregistrerDevis(){
  if (!dernierResultat) return;
  const clientNom = document.getElementById("clientNom").value.trim();
  const statusEl = document.getElementById("devisStatus");
  statusEl.textContent = "Enregistrement...";

  await apiFetch("/rest/v1/devis_liste", {
    method: "POST",
    headers: { "Prefer": "return=minimal" },
    body: JSON.stringify({
      user_id: session.user.id,
      client_nom: clientNom || null,
      items: dernierResultat.items,
      total: dernierResultat.total,
      statut: "envoye"
    })
  });

  statusEl.textContent = "Devis enregistré.";
  document.getElementById("devisTexte").value = "";
  document.getElementById("clientNom").value = "";
  document.getElementById("devisResult").classList.remove("visible");
  document.getElementById("enregistrerDevisBtn").style.display = "none";
  dernierResultat = null;
  setTimeout(() => statusEl.textContent = "", 2000);
}

// ---------- Historique ----------
async function chargerHistorique(){
  const listeEl = document.getElementById("historiqueListe");
  listeEl.innerHTML = '<div class="empty">Chargement...</div>';

  const res = await apiFetch("/rest/v1/devis_liste?select=*&order=created_at.desc");
  const data = await res.json();

  if (!Array.isArray(data) || data.length === 0) {
    listeEl.innerHTML = '<div class="empty">Aucun devis enregistré pour l\'instant.</div>';
    return;
  }

  listeEl.innerHTML = "";
  data.forEach(d => {
    const date = new Date(d.created_at).toLocaleDateString("fr-CH");
    const card = document.createElement("div");
    card.className = "devis-card";
    card.innerHTML = `
      <div class="devis-top"><span>${d.client_nom || "Client sans nom"}</span><span>${d.total.toFixed(2)} CHF</span></div>
      <div class="devis-meta">${date} · <span class="badge ${d.statut}">${d.statut}</span></div>
      <select class="statut-select" data-id="${d.id}" onchange="changerStatut(this)">
        <option value="envoye" ${d.statut === "envoye" ? "selected" : ""}>Envoyé</option>
        <option value="relance" ${d.statut === "relance" ? "selected" : ""}>Relancé</option>
        <option value="accepte" ${d.statut === "accepte" ? "selected" : ""}>Accepté</option>
        <option value="refuse" ${d.statut === "refuse" ? "selected" : ""}>Refusé</option>
      </select>`;
    listeEl.appendChild(card);
  });
}

async function changerStatut(select){
  const id = select.dataset.id;
  const statut = select.value;
  await apiFetch("/rest/v1/devis_liste?id=eq." + id, {
    method: "PATCH",
    headers: { "Prefer": "return=minimal" },
    body: JSON.stringify({ statut })
  });
  chargerHistorique();
}
</script>
